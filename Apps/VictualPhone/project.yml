name: VictualPhone

options:
  bundleIdPrefix: dev.victual
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# DEVELOPMENT_TEAM comes from the untracked Apps/Local.xcconfig (see
# Apps/Local.xcconfig.example), so regenerating this project cannot lose it and
# no team ID is committed. Base.xcconfig includes it only if it exists.
configFiles:
  Debug: ../Base.xcconfig
  Release: ../Base.xcconfig

packages:
  VictualKit:
    # The same package the macOS application consumes. The phone is its second
    # front end, and the first one that is not a Mac.
    path: ../..

targets:
  VictualPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: VictualKit
        product: VictualUI
      - package: VictualKit
        product: VictualStock
      - package: VictualKit
        product: VictualHealth
    # Generated output, like the .xcodeproj; not committed.
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Victual
        # "Victual" is said "vittle", and without this VoiceOver and Siri read
        # it back as "vik-choo-al". It fixes speaking only, not hearing; the
        # app's name is docs/concepts/siri-and-app-intents.md §7.6's open
        # question and is not settled by this.
        CFBundleSpokenName: vittle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Shown by the system the first time the scanner asks for the camera.
        # It is the only thing a person reads before deciding, so it says what
        # the camera is for and that nothing is kept.
        NSCameraUsageDescription: Victual reads barcodes and labels with the camera, to find what you are holding in your household's stock. No image is stored or sent.
        # Victual is self-hosted, and a household instance is commonly plain
        # http on the LAN -- `http://pantry.local`, a bare IP. App Transport
        # Security refuses those by default. This key exempts only local
        # addresses; anything reached over the internet still needs TLS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Read-only: nothing is written to Health, so there is deliberately no
        # NSHealthUpdateUsageDescription. This is the only text a person reads
        # before consenting (docs/plans/03-healthkit-medication-sync.md).
        NSHealthShareUsageDescription: Victual reads the doses you log in the Health app's Medications, and nothing else. It only reads; it never writes to Health. Doses are sent only to your own Victual server, so it can take the matching item out of your household's stock.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait only on a phone: a scanner that rotates under a person's
        # hand while they aim it is worse than one that does not.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    entitlements:
      path: Resources/VictualPhone.entitlements
      properties:
        com.apple.developer.healthkit: true
        # What Xcode itself writes for a HealthKit app that reads no clinical
        # records.
        com.apple.developer.healthkit.access: []
        # Needed before Health will accept enableBackgroundDelivery on iOS 15+.
        # The device spike (plan 03 Phase 0) asks whether it works for dose
        # events; without this key a rejection would say nothing about that.
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.victual.VictualPhone
        PRODUCT_NAME: Victual
        TARGETED_DEVICE_FAMILY: "1"
        # Matches the macOS application; see Apps/Victual/README.md#version.
        MARKETING_VERSION: "0.3.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The simulator needs no team. A device does: DEVELOPMENT_TEAM comes
        # from the untracked Apps/Local.xcconfig (see configFiles above), never
        # from this file. CI overrides signing with CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  VictualPhone:
    build:
      targets:
        VictualPhone: all
    # Cmd-U runs the package's own test targets, so the whole suite is one
    # keystroke from the IDE. The apps have no test targets of their own: their
    # logic lives in the package (see the README).
    test:
      config: Debug
      targets:
        - package: VictualKit/VictualAPITests
        - package: VictualKit/VictualCoreTests
        - package: VictualKit/VictualUITests
        - package: VictualKit/VictualStockTests
    run:
      config: Debug
    archive:
      config: Release
