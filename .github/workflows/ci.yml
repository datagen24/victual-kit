name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch upstream specification changes even when nothing here moves.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read is all any job needs: they build and test, and publish nothing.
permissions:
  contents: read

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here talks to git after the checkout, and the jobs then run
          # code out of the tree — Package.swift, the OpenAPI generator build
          # plugin, xcodebuild. Leaving the token in .git/config would put it
          # within reach of all of that.
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test

  platforms:
    name: Build ${{ matrix.destination }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        destination:
          - "generic/platform=macOS"
          - "generic/platform=iOS"
          - "generic/platform=iOS Simulator"
          - "generic/platform=tvOS"
          - "generic/platform=watchOS"
          - "generic/platform=visionOS"
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here talks to git after the checkout, and the jobs then run
          # code out of the tree — Package.swift, the OpenAPI generator build
          # plugin, xcodebuild. Leaving the token in .git/config would put it
          # within reach of all of that.
          persist-credentials: false
      # VictualAPI runs the swift-openapi-generator build plugin, which
      # xcodebuild will not execute unattended without this flag.
      - name: Build
        run: |
          xcodebuild -scheme VictualUI \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            build

  app:
    name: Build the macOS application
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here talks to git after the checkout, and the jobs then run
          # code out of the tree — Package.swift, the OpenAPI generator build
          # plugin, xcodebuild. Leaving the token in .git/config would put it
          # within reach of all of that.
          persist-credentials: false
      - name: XcodeGen
        run: brew install xcodegen
      # The .xcodeproj is generated output, like Sources/VictualAPI/openapi.json.
      # project.yml is the checked-in source of truth.
      - name: Generate the project
        working-directory: Apps/Victual
        run: xcodegen generate
      # No signing identity on the runner, and none is needed to find a compile
      # error. The Keychain path is exercised on a developer machine instead;
      # see docs/plans/01-macos-stock-app.md, verification item 5.
      - name: Build
        working-directory: Apps/Victual
        run: |
          xcodebuild -project Victual.xcodeproj \
            -scheme Victual \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

  phone:
    name: Build the iPhone application
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # See the test job.
          persist-credentials: false
      - name: XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: Apps/VictualPhone
        run: xcodegen generate
      # A simulator build needs no signing identity. The live scanner cannot
      # run in a simulator at all; it is verified on a phone. See
      # docs/plans/02-iphone-scanning-app.md, verification item 4.
      - name: Build
        working-directory: Apps/VictualPhone
        run: |
          xcodebuild -project VictualPhone.xcodeproj \
            -scheme VictualPhone \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

  spec-drift:
    name: OpenAPI specification drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here talks to git after the checkout, and the jobs then run
          # code out of the tree — Package.swift, the OpenAPI generator build
          # plugin, xcodebuild. Leaving the token in .git/config would put it
          # within reach of all of that.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare vendored specification against upstream
        run: Scripts/update-openapi.py --check
