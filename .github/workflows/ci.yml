name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch upstream specification changes even when nothing here moves.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test

  platforms:
    name: Build ${{ matrix.destination }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        destination:
          - "generic/platform=macOS"
          - "generic/platform=iOS"
          - "generic/platform=iOS Simulator"
          - "generic/platform=tvOS"
          - "generic/platform=watchOS"
          - "generic/platform=visionOS"
    steps:
      - uses: actions/checkout@v4
      # VictualAPI runs the swift-openapi-generator build plugin, which
      # xcodebuild will not execute unattended without this flag.
      - name: Build
        run: |
          xcodebuild -scheme VictualUI \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            build

  app:
    name: Build the macOS application
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      # The .xcodeproj is generated output, like Sources/VictualAPI/openapi.json.
      # project.yml is the checked-in source of truth.
      - name: Generate the project
        working-directory: Apps/Victual
        run: xcodegen generate
      # No signing identity on the runner, and none is needed to find a compile
      # error. The Keychain path is exercised on a developer machine instead;
      # see docs/plans/01-macos-stock-app.md, verification item 5.
      - name: Build
        working-directory: Apps/Victual
        run: |
          xcodebuild -project Victual.xcodeproj \
            -scheme Victual \
            -destination "platform=macOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

  spec-drift:
    name: OpenAPI specification drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare vendored specification against upstream
        run: Scripts/update-openapi.py --check
