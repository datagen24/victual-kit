# Read the Docs build configuration. See .devtools/docs/README.md.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      - python3 .devtools/docs/stage.py

python:
  install:
    - requirements: .devtools/docs/requirements.txt

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
